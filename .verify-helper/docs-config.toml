[languages.codon]
compile = "codon build -release {path} -o a.out"
execute = "./a.out -f {path}"
bundle = "python3 library/bundle.py {path}"
list_dependencies = '''awk '/^from \.\.\.library\./ {{ sub(/^from \.\.\.library\./, ""); sub(/ import.*$/, ""); gsub(/\./, "/"); print "library/" $0 ".py" }} /^from library\.library\./ {{ sub(/^from library\.library\./, ""); sub(/ import.*$/, ""); gsub(/\./, "/"); print "library/" $0 ".py" }}' {path}'''
verification_file_suffix = ".test.codon"
