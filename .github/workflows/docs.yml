name: docs

on:
  push:
    branches:
      - main

jobs:
  docs:
    runs-on: ubuntu-latest

    permissions:
        contents: write 
        pages: write
        id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Codon
        run: |
          /bin/bash -c "$(curl -fsSL https://exaloop.io/install.sh)" || true
          echo "$HOME/.codon/bin" >> "$GITHUB_PATH"

      - name: Check Codon
        run: |
          which codon
          codon --version

      - name: Install oj-verify
        run: |
          pip install "setuptools<81"
          pip install online-judge-verify-helper
      
      - name: Patch online-judge-verify-helper
        run: |
          python - <<'PY'
          import onlinejudge_verify.languages.list as x

          path = x.__file__
          print("Patching:", path)

          with open(path, encoding="utf-8") as f:
              s = f.read()

          # ここにローカルで行った変更を書く
          s = s.replace(
              "_dict['.py'] = PythonLanguage()",
              ""
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(s)
          PY
          
      - name: Verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YUKICODER_TOKEN: ${{ secrets.YUKICODER_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          oj-verify --config-file .verify-helper/docs-config.toml run
      - name: Check files
        run: |
          pwd
          ls -la
          find . -name bundle.py
      
      - name: Debug markdown files
        run: |
          echo "PWD=$(pwd)"
          echo "---- markdown files ----"
          find . -name '*.md' -not -path './.git/*' -print
          echo "---- documentation_of ----"
          grep -R -n 'documentation_of:' . \
            --include='*.md' \
            --exclude-dir=.git
      
      - name: Debug markdown paths
        run: |
          python3 - <<'PY'
          import pathlib
          from onlinejudge_verify.documentation import configure, front_matter

          basedir = pathlib.Path.cwd()
          print("basedir =", basedir)

          print("=== find_markdown_paths ===")
          paths = configure.find_markdown_paths(basedir=basedir)

          for p in paths:
              print("MARKDOWN:", p)
              with open(p, "rb") as f:
                  fm, _ = front_matter.split_front_matter(f.read())
              if "documentation_of" in fm:
                  print("  documentation_of =", repr(fm["documentation_of"]))
          PY

      - name: Debug onlinejudge-verify
        run: |
          pip show online-judge-verify-helper
          python3 - <<'PY'
          import onlinejudge_verify
          import onlinejudge_verify.documentation.configure as configure

          print("onlinejudge_verify:", onlinejudge_verify.__file__)
          print("configure:", configure.__file__)
          PY

            
      - name: Debug environment
        run: |
          pwd
          python3 -c "import pathlib; print(pathlib.Path.cwd())"
          python3 -c "import onlinejudge_verify; print(onlinejudge_verify.__file__)"
          python3 -c "import onlinejudge_verify.documentation.configure as x; print(x.__file__)"

      - name: Generate documentation
        run: |
          oj-verify --config-file .verify-helper/docs-config.toml docs 

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Build Jekyll site
        working-directory: .verify-helper/markdown 
        run: |
          bundle install --path .vendor/bundle
          bundle exec jekyll build
      
      - name: Check Jekyll output
        working-directory: .verify-helper/markdown
        run: |
          echo "---- _site ----"
          find _site -type f | sort

      - name: Debug Jekyll config
        working-directory: .verify-helper/markdown
        run: |
          cat _config.yml
      
      - name: Debug generated markdown
        working-directory: .verify-helper/markdown
        run: |
          find . -name '*.md' -print
          echo "---- factorial ----"
          cat library/math/factorial.py.md

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .verify-helper/markdown/_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4