name: docs

on:
  push:
    branches:
      - main

jobs:
  docs:
    runs-on: ubuntu-latest

    permissions:
        contents: read
        pages: write
        id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Codon
        run: |
          /bin/bash -c "$(curl -fsSL https://exaloop.io/install.sh)" || true
          echo "$HOME/.codon/bin" >> "$GITHUB_PATH"

      - name: Check Codon
        run: |
          which codon
          codon --version

      - name: Install oj-verify
        run: |
          pip install "setuptools<81"
          pip install online-judge-verify-helper
    
      - name: Check oj-verify version
        run: |
            pip show online-judge-verify-helper

      - name: Debug language registration
        run: |
            python - <<'PY'
            import onlinejudge_verify.languages.list as x
            from onlinejudge_verify.config import get_config

            print("config:")
            print(get_config())

            d = {}

            print("before:", d)

            # list.py と同じ初期登録
            from onlinejudge_verify.languages.cpp import CPlusPlusLanguage
            from onlinejudge_verify.languages.csharp import CSharpScriptLanguage
            from onlinejudge_verify.languages.nim import NimLanguage
            from onlinejudge_verify.languages.haskell import HaskellLanguage
            from onlinejudge_verify.languages.ruby import RubyLanguage
            from onlinejudge_verify.languages.go import GoLanguage
            from onlinejudge_verify.languages.java import JavaLanguage
            from onlinejudge_verify.languages.rust import RustLanguage

            d['.cpp'] = CPlusPlusLanguage()
            d['.hpp'] = d['.cpp']
            d['.cc'] = d['.cpp']
            d['.h'] = d['.cpp']
            d['.csx'] = CSharpScriptLanguage()
            d['.nim'] = NimLanguage()
            d['.hs'] = HaskellLanguage()
            d['.ruby'] = RubyLanguage()
            d['.go'] = GoLanguage()
            d['.java'] = JavaLanguage()
            d['.rs'] = RustLanguage()

            print("after builtin:", d.keys())

            for ext, config in get_config().get('languages', {}).items():
                print("processing:", repr(ext))
                print("  exists:", '.' + ext in d)
                print("  keys:", d.keys())
            PY

      - name: Verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YUKICODER_TOKEN: ${{ secrets.YUKICODER_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          oj-verify all

      - name: Generate documentation
        run: |
          oj-verify docs

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Build Jekyll site
        working-directory: .verify-helper/markdown
        run: |
          bundle install --path .vendor/bundle
          bundle exec jekyll build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .verify-helper/markdown/_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4